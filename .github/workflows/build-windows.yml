# DEPRECATED: multi-platform build moved to build-desktop.yml.
# Keep this file only for history; it never triggers anymore.
name: Build Windows EXE (deprecated)

on: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name MagiskPatcher `
            --icon bin/logo.ico `
            --collect-all customtkinter `
            --add-data "bin/windows/x86_64/magiskboot.exe;bin/windows/x86_64" `
            --add-data "bin/logo.ico;bin" `
            --add-data "bin/logo.png;bin" `
            --add-data "bin/splash.png;bin" `
            --add-data "bin/alipay.png;bin" `
            --add-data "bin/wechat.png;bin" `
            --add-data "bin/zfbhb.png;bin" `
            magiskpatcher.py

      - name: Verify EXE
        shell: pwsh
        run: Get-Item dist/MagiskPatcher.exe | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagiskPatcher-windows
          path: dist/MagiskPatcher.exe

      - name: Create git tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/MagiskPatcher.exe
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
