name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 4.1.0 (tag will be v4.1.0)'
        required: false
        default: '4.1.0'
      prerelease:
        description: 'Mark this release as a pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  determine-tag:
    name: Determine release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: determine-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: MagiskPatcher-windows
            upload_path: dist/MagiskPatcher.exe
            pyinstaller_args: >-
              --windowed
              --icon bin/logo.ico
              --add-data "bin/windows/x86_64/magiskboot.exe;bin/windows/x86_64"
              --add-data "bin/logo.ico;bin"
              --add-data "bin/logo.png;bin"
              --add-data "bin/splash.png;bin"
              --add-data "bin/alipay.png;bin"
              --add-data "bin/wechat.png;bin"
              --add-data "bin/zfbhb.png;bin"
          - name: Linux
            os: ubuntu-latest
            artifact: MagiskPatcher-linux
            upload_path: dist/MagiskPatcher
            pyinstaller_args: >-
              --add-data "bin/logo.png:bin"
              --add-data "bin/splash.png:bin"
              --add-data "bin/alipay.png:bin"
              --add-data "bin/wechat.png:bin"
              --add-data "bin/zfbhb.png:bin"
          - name: macOS
            os: macos-latest
            artifact: MagiskPatcher-macos
            upload_path: dist/MagiskPatcher-macos.zip
            pyinstaller_args: >-
              --windowed
              --add-data "bin/macos:bin/macos"
              --add-data "bin/logo.png:bin"
              --add-data "bin/splash.png:bin"
              --add-data "bin/alipay.png:bin"
              --add-data "bin/wechat.png:bin"
              --add-data "bin/zfbhb.png:bin"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name MagiskPatcher --collect-all customtkinter ${{ matrix.pyinstaller_args }} magiskpatcher.py

      - name: Verify build output
        shell: bash
        run: ls -la dist/

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r MagiskPatcher-macos.zip MagiskPatcher.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.upload_path }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [determine-tag, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Create git tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.determine-tag.outputs.tag }}"
          git push origin "${{ needs.determine-tag.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-tag.outputs.tag }}
          files: dist/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
